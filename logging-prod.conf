[loggers]
keys=root

[handlers]
keys=consoleHandler,fileHandler,errorFileHandler

[formatters]
keys=simpleFormatter,detailFormatter

# -----------------
# LOGGERS
# -----------------
[logger_root]
level=INFO
handlers=consoleHandler,fileHandler,errorFileHandler

# -----------------
# HANDLERS
# -----------------

# Console (stdout)
[handler_consoleHandler]
class=StreamHandler
level=INFO
formatter=simpleFormatter
args=(sys.stdout,)

# General log file (everything INFO+)
[handler_fileHandler]
class=logging.handlers.RotatingFileHandler
level=INFO
formatter=detailFormatter
args=('/var/log/vestaboard-patterns/vestaboard-patterns.log', 'a', 10485760, 5)
# 10MB per file, keep 5 backups

# Error log file (WARNING+)
[handler_errorFileHandler]
class=logging.handlers.RotatingFileHandler
level=WARNING
formatter=detailFormatter
args=('/var/log/vestaboard-patterns/error.log', 'a', 10485760, 5)

# -----------------
# FORMATTERS
# -----------------

# Simple (console)
[formatter_simpleFormatter]
format=%(levelname)s - %(message)s

# Detailed (files)
[formatter_detailFormatter]
format=%(asctime)s | %(levelname)s | %(name)s | %(filename)s:%(lineno)d | %(message)s
datefmt=%Y-%m-%d %H:%M:%S